name: Verify and Package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      preview_0_1_1_preview_2_diagnostic:
        description: Inspect the fixed preview.2 release-candidate DMGs without executing them
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  preview-dmg-candidate-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_0_1_1_preview_2_diagnostic
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/preview-dmg-candidate-diagnostic.yml
  desktop:
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            dmg_arch: arm64
            published_dmg: RepoDeck_0.1.0_macos_arm64.dmg
            published_dmg_sha256: 12e4ef3481454c39744a3991eb72e20d936ac99cc0d5d85cd96c81fdf58bf660
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            dmg_arch: x86_64
            published_dmg: RepoDeck_0.1.0_macos_x64.dmg
            published_dmg_sha256: c0b7036b6e0d1e8cd45e306ea35230e48a65f2961af9b3d21b0cc7f8fbe2576b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check:release
      - run: npm run test:release
      - name: macOS DMG validator regressions
        run: node --test scripts/mac/validate-dmg.test.cjs
      - name: Download published v0.1.0 DMG for native diagnosis
        if: runner.os == 'macOS'
        shell: bash
        env:
          PUBLISHED_DMG: ${{ matrix.published_dmg }}
          PUBLISHED_DMG_SHA256: ${{ matrix.published_dmg_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .tools/published-v0.1.0 .tools/dmg-evidence
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --output ".tools/published-v0.1.0/$PUBLISHED_DMG" \
            "https://github.com/pulkitchandra1997/RepoDeck/releases/download/v0.1.0/$PUBLISHED_DMG"
          printf '%s  %s\n' "$PUBLISHED_DMG_SHA256" ".tools/published-v0.1.0/$PUBLISHED_DMG" | shasum -a 256 --check -
      - name: Inspect published v0.1.0 DMG natively without executing it
        id: published_dmg_validation
        if: runner.os == 'macOS'
        continue-on-error: true
        run: >-
          node scripts/mac/validate-dmg.cjs
          --directory .tools/published-v0.1.0
          --version 0.1.0
          --arch ${{ matrix.dmg_arch }}
          --sha256 ${{ matrix.published_dmg_sha256 }}
          --signature observe
          --evidence .tools/dmg-evidence/published-v0.1.0-${{ matrix.dmg_arch }}.json
      - name: Record published v0.1.0 native diagnosis
        if: runner.os == 'macOS' && always()
        shell: bash
        env:
          PUBLISHED_DMG: ${{ matrix.published_dmg }}
          PUBLISHED_DMG_OUTCOME: ${{ steps.published_dmg_validation.outcome }}
        run: |
          {
            echo "### Published v0.1.0 DMG diagnosis"
            echo
            echo "- Artifact: \`$PUBLISHED_DMG\`"
            echo "- Native validation outcome: \`$PUBLISHED_DMG_OUTCOME\`"
            echo "- This historical diagnostic does not execute the downloaded app."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run test:notices
      - name: Frontend tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: npm test
      - name: Frontend tests with bounded Intel worker contention
        if: matrix.target == 'x86_64-apple-darwin'
        run: npm test -- --maxWorkers=1
      - name: Repeated Intel preview interaction regression
        if: matrix.target == 'x86_64-apple-darwin'
        run: node -e "const cp=require('node:child_process');for(let i=0;i<5;i++){console.log('Preview interaction repetition',i+1);const r=cp.spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run','apps/desktop/src/ContentPreview.test.tsx','--maxWorkers=1'],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}"
      - name: Repeated cold-start readiness regression
        if: matrix.target == 'x86_64-apple-darwin'
        run: node -e "const cp=require('node:child_process');for(let i=0;i<5;i++){console.log('Cold-start repetition',i+1);const r=cp.spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run','apps/desktop/src/App.test.tsx','-t','shows the backend comparison limitation'],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}"
      - name: Theme text contrast
        if: runner.os == 'Windows'
        run: npm run test:contrast
      - run: cargo test --locked -p repodeck-core
      - name: Repeated watcher regression
        if: runner.os == 'macOS'
        run: node -e "const cp=require('node:child_process');for(let i=0;i<15;i++){console.log('Watcher repetition',i+1);const r=cp.spawnSync('cargo',['test','--locked','-p','repodeck-core','--test','watch','--','--nocapture'],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}"
      - name: Release security gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo test --locked -p repodeck-core --test repository filter
      - name: Require completed release readiness review
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-preview.') && vars.REPODECK_RELEASE_APPROVED != 'true'
        run: node -e "console.error('Release blocked pending platform, security and dependency-license review. See docs/releases/release-guide.md.'); process.exit(1)"
      - name: Block stable distribution until signing is implemented
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-preview.')
        run: node -e "console.error('Stable release signing and notarization are not implemented. A readiness variable alone cannot authorize unsigned stable distribution.'); process.exit(1)"
      - name: Validate explicit unsigned preview policy and merged source
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release.cjs --preview-policy
      - run: npm run test:private-git
      - name: Authenticated HTTPS fixture
        if: runner.os == 'Windows'
        run: npm run test:private-git
        env:
          REPODECK_TEST_TLS: '1'
      - run: cargo fmt --all --check
      - run: npm run build
      - name: Fresh production browser regression
        if: runner.os == 'Windows'
        run: npm run test:repository-metadata
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Build ad-hoc signed macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Validate generated macOS DMG before staging or upload
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SHORT_VERSION="$(node -p "require('./scripts/mac/validate-dmg.cjs').appleShortVersion(require('./package.json').version)")"
          node scripts/mac/validate-dmg.cjs \
            --directory "target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}" \
            --version "$SHORT_VERSION" \
            --arch "${{ matrix.dmg_arch }}" \
            --signature ad-hoc \
            --evidence ".tools/dmg-evidence/generated-${{ matrix.dmg_arch }}.json"
      - name: Upload native macOS DMG evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-dmg-evidence-${{ matrix.target }}
          path: .tools/dmg-evidence/*.json
          if-no-files-found: error
      - name: Stage versioned installers
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/stage-release.cjs target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }} ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.target }}
          path: .tools/release-assets/*
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repodeck-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
  verification:
    name: Desktop verification
    if: always()
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Require all desktop targets to pass
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: test "$DESKTOP_RESULT" = success
      - name: Create artifact round-trip fixture
        run: node -e "const fs=require('node:fs'); fs.mkdirSync('artifact-input'); fs.writeFileSync('artifact-input/fixture.txt','RepoDeck artifact compatibility');"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-fixture
          path: artifact-input/fixture.txt
          if-no-files-found: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compatibility-*
          path: artifact-output
          merge-multiple: true
      - name: Verify artifact round-trip
        run: node -e "const fs=require('node:fs'); const assert=require('node:assert/strict'); assert.deepEqual(fs.readFileSync('artifact-output/fixture.txt'),fs.readFileSync('artifact-input/fixture.txt'));"
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.')
    needs: [desktop, verification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: false
      - name: Validate exact release set and generate version notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-release-notes.cjs release-assets release-notes.md
      - name: Create new unsigned draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/release-*/* LICENSE --verify-tag --draft --prerelease --latest=false --title "RepoDeck $RELEASE_TAG (unsigned development preview)" --notes-file release-notes.md
