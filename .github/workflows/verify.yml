name: Verify and Package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check:release
      - run: npm run test:release
      - run: npm test
      - name: Theme text contrast
        if: runner.os == 'Windows'
        run: npm run test:contrast
      - run: cargo test --locked -p repodeck-core
      - name: Release security gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo test --locked -p repodeck-core --test repository filter
      - name: Require completed release readiness review
        if: startsWith(github.ref, 'refs/tags/v') && vars.REPODECK_RELEASE_APPROVED != 'true'
        run: node -e "console.error('Release blocked pending platform, security and dependency-license review. See docs/releases/release-guide.md.'); process.exit(1)"
      - run: npm run test:private-git
      - name: Authenticated HTTPS fixture
        if: runner.os == 'Windows'
        run: npm run test:private-git
        env:
          REPODECK_TEST_TLS: '1'
      - run: cargo fmt --all --check
      - run: npm run build
      - name: Fresh production browser regression
        if: runner.os == 'Windows'
        run: npm run test:repository-metadata
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Stage versioned installers
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/stage-release.cjs target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }} ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.target }}
          path: .tools/release-assets/*
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repodeck-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
  verification:
    name: Desktop verification
    if: always()
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Require all desktop targets to pass
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: test "$DESKTOP_RESULT" = success
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum --check *.sha256
          cd ..
          gh release create "$RELEASE_TAG" release-assets/* LICENSE --verify-tag --draft --prerelease --title "RepoDeck $RELEASE_TAG (development preview)" --notes-file docs/releases/preview-notes.md
