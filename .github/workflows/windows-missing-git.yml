name: Isolated Windows missing Git rejection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  missing-git:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Safe guard and transaction tests
        shell: pwsh
        run: |
          ./scripts/windows/installer-lifecycle.test.ps1
          ./scripts/windows/missing-git.test.ps1
      - name: Missing Git silent rejection in fresh hosted VM
        shell: pwsh
        run: ./scripts/windows/missing-git.ps1
      - name: Preserve negative-case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-preview3-missing-git
          path: ${{ runner.temp }}/repodeck-missing-git/result.json
          if-no-files-found: warn
