name: Preview DMG Candidate Diagnostic
on:
  workflow_call:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    name: Native candidate inspection (${{ matrix.arch }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            release_artifact: release-aarch64-apple-darwin
            dmg: RepoDeck_0.1.1-preview.2_macos_arm64.dmg
            sha256: cba596d36e73af2a03c256cabffce82f41d919b30472d75842b969c64b661fc9
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            release_artifact: release-x86_64-apple-darwin
            dmg: RepoDeck_0.1.1-preview.2_macos_x64.dmg
            sha256: 14208190b5a1cb0c1996ebd4e01736a030ad58a9f0954cc7c21be299db3969c8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download fixed preview.2 release-candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.release_artifact }}
          path: .tools/preview-candidate
          github-token: ${{ github.token }}
          repository: pulkitchandra1997/RepoDeck
          run-id: '35592666201'
      - name: Require exact source run, asset set and pinned DMG hash
        shell: bash
        env:
          CANDIDATE_DMG: ${{ matrix.dmg }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r HEAD_SHA STATUS CONCLUSION < <(
            gh api repos/pulkitchandra1997/RepoDeck/actions/runs/35592666201 \
              --jq '[.head_sha, .status, .conclusion] | @tsv'
          )
          test "$HEAD_SHA" = a363fe70371dc1948225383810e79eb0002ef92f
          test "$STATUS" = completed
          test "$CONCLUSION" = success

          ROOT=.tools/preview-candidate
          test -f "$ROOT/$CANDIDATE_DMG"
          test -f "$ROOT/$CANDIDATE_DMG.json"
          test -f "$ROOT/$CANDIDATE_DMG.sha256"
          test -z "$(find "$ROOT" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ROOT/$CANDIDATE_DMG" | shasum -a 256 --check -
          (cd "$ROOT" && shasum -a 256 --check "$CANDIDATE_DMG.sha256")
      - name: Inspect exact candidate natively without executing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/preview-candidate-evidence
          node scripts/mac/validate-dmg.cjs \
            --directory .tools/preview-candidate \
            --version 0.1.1 \
            --arch "${{ matrix.arch }}" \
            --sha256 "${{ matrix.sha256 }}" \
            --signature ad-hoc \
            --evidence ".tools/preview-candidate-evidence/preview-0.1.1-preview.2-${{ matrix.arch }}.json"
      - name: Upload exact candidate evidence separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-0.1.1-preview.2-dmg-evidence-${{ matrix.target }}
          path: .tools/preview-candidate-evidence/*.json
          if-no-files-found: error
